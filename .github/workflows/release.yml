name: Release exact commit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Stop after test, or promote the same artifact to production
        required: true
        type: choice
        options: [test, production]
      release_sha:
        description: Full 40-character commit SHA to test and deploy
        required: true
        type: string
      production_confirmation:
        description: For production only, type DEPLOY swirl-girl
        required: false
        type: string
      apps_script_version:
        description: Current deployed Apps Script version (required for production)
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 2
      - name: Verify immutable release and Apps Script boundary
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
          TARGET: ${{ inputs.target }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          APPS_SCRIPT_VERSION: ${{ inputs.apps_script_version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "release_sha must be a full commit SHA"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${REQUESTED_SHA,,}" ]] || { echo "Checked-out commit does not match release_sha"; exit 1; }
          if [[ "$TARGET" == "production" ]]; then
            [[ "$PRODUCTION_CONFIRMATION" == "DEPLOY swirl-girl" ]] || { echo "Production confirmation did not match"; exit 1; }
            [[ "$APPS_SCRIPT_VERSION" =~ ^[1-9][0-9]*$ ]] || { echo "Production requires the deployed Apps Script version"; exit 1; }
          fi
          if git rev-parse HEAD^ >/dev/null 2>&1 && ! git diff --quiet HEAD^ HEAD -- apps-script/; then
            if [[ "$TARGET" == "test" ]]; then
              echo "Shared Apps Script changes cannot be shipped through a test-only release."
              exit 1
            fi
          fi
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Seal the tested static build
        run: |
          tar -czf release-dist.tgz dist
          sha256sum release-dist.tgz > release-dist.tgz.sha256
      - name: Upload tested artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.release_sha }}
          path: |
            release-dist.tgz
            release-dist.tgz.sha256
          if-no-files-found: error
          retention-days: 14

  deploy-test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore the tested artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.release_sha }}
      - run: |
          sha256sum --check release-dist.tgz.sha256
          rm -rf dist
          tar -xzf release-dist.tgz
      - name: Record current test deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --config wrangler.test.jsonc --json > test-before.json
      - name: Deploy test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/assert-test-deploy.mjs
          npx wrangler deploy --config wrangler.test.jsonc
      - name: Smoke-check test
        run: npm run smoke:test
      - name: Record resulting test deployment
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --config wrangler.test.jsonc --json > test-after.json || true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-test-${{ github.run_id }}
          path: test-*.json
          if-no-files-found: warn
          retention-days: 30

  deploy-production:
    if: inputs.target == 'production'
    needs: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out the exact test-deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore the same artifact deployed to test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ inputs.release_sha }}
      - run: |
          sha256sum --check release-dist.tgz.sha256
          rm -rf dist
          tar -xzf release-dist.tgz
      - name: Record current production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --config wrangler.jsonc --json > production-before.json
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Smoke-check production
        run: npm run smoke:production
      - name: Record release evidence
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > production-after.json || true
          {
            echo "## Production release"
            echo "- Commit: ${{ inputs.release_sha }}"
            echo "- Static artifact: release-${{ inputs.release_sha }}"
            echo "- Apps Script version: ${{ inputs.apps_script_version || 'unchanged' }}"
            echo "- Test smoke checks passed before the production approval gate."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-production-${{ github.run_id }}
          path: production-*.json
          if-no-files-found: warn
          retention-days: 30
